  <main class="design-index">
    <div class="design-wrap">
      <section class="design-intro">
        <h1 class="design-title">DESIGN<sup class="design-total">16</sup></h1>
        <p class="design-lede">가상 브랜드 기획부터 상세페이지, 배너, SNS, 카드뉴스까지. 이미지 소스는 AI로 만들고, 레이아웃과 디자인은 Figma에서 직접 완성했습니다.</p>
      </section>

      <div class="tool-steps design-tools" data-tool-steps aria-label="공통 작업 도구"></div>

      <div class="design-bar">
        <div class="design-filter" role="group" aria-label="디자인 분류">
          <span class="design-filter-thumb" aria-hidden="true"></span>
          <button type="button" data-filter="all" aria-pressed="true">전체 <span></span></button>
          <button type="button" data-filter="detail" aria-pressed="false">상세페이지 <span></span></button>
          <button type="button" data-filter="banner" aria-pressed="false">배너 <span></span></button>
          <button type="button" data-filter="sns" aria-pressed="false">SNS <span></span></button>
          <button type="button" data-filter="card" aria-pressed="false">카드뉴스 <span></span></button>
        </div>
        <span class="design-hint">HOVER TO SCROLL · CLICK TO VIEW</span>
      </div>

      <section class="design-zone" id="zone-detail" aria-labelledby="zone-detail-title">
        <div class="design-zone-head"><h2 id="zone-detail-title">DETAIL PAGE</h2><span class="meta">860PX · LONG-FORM</span></div>
        <div class="long-list"></div>
      </section>

      <section class="design-zone" id="zone-content" aria-labelledby="zone-content-title">
        <div class="design-zone-head"><h2 id="zone-content-title">CONTENT</h2><span class="meta">BANNER · SNS · CARD NEWS</span></div>
        <div class="mason"></div>
      </section>
      <noscript><p class="design-lede">이 페이지는 JavaScript로 목록을 그립니다.</p></noscript>
    </div>

    <dialog class="viewer" aria-label="작업 크게 보기" data-lenis-prevent>

        <div class="viewer-stage">

        </div>
        <div class="viewer-foot"><div class="viewer-title"></div><dl class="viewer-meta"></dl></div>
